<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#232c33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wahey">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=3">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Wahey</title>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&f[]=general-sans@400,500,600&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/coach.css">
  <link rel="stylesheet" href="/css/journal.css">
  <link rel="stylesheet" href="/css/body-age.css">
  <link rel="stylesheet" href="/css/motion.css">
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- Pure logic with no DOM, shared with the Node tests. Each file sets one global, such as window.Score. -->
  <script src="/lib/score.js"></script>
  <script src="/lib/format.js"></script>
  <script src="/lib/words.js"></script>
  <script src="/lib/strength.js"></script>
  <script src="/lib/habits.js"></script>
  <script src="/lib/body-age.js"></script>

  <!-- The app. Babel standalone compiles the JSX here in the browser (no build step) and runs the files in this order. -->
  <script type="text/babel" data-presets="react" src="/js/core.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/ui.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/sync.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/charts.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/journal.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/chat.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/body-age.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/screens/today.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/screens/recovery.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/screens/sleep.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/screens/strain.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/screens/trends.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/screens/strength.jsx"></script>
  <script type="text/babel" data-presets="react" src="/js/app.jsx"></script>
</body>
</html>
