  const close = () => { if (closing.current) return; closing.current = true; setOn(false); setTimeout(onClose, still() ? 180 : 280); };

  const send = async (raw) => {
    const q = String(raw || '').replace(/\s+/g, ' ').trim();
    if (!q || busy.current) return;
    busy.current = true; setText(''); setFail(null); setSure(false); setView('chat'); setWait(q);
    try {
      const r = await api(CH_API, { method: 'POST', body: JSON.stringify({ date, question: q, context: getContext() }) });
      if (r.error || !Array.isArray(r.messages)) setFail({ q, msg: chErrorText(r.error) });
      else { const last = r.messages[r.messages.length - 1]; setFresh(last ? last.id : null); setChat({ messages: r.messages, memory: r.memory }); }
    } catch { setFail({ q, msg: 'Couldn’t reach the server. Nothing was saved.' }); }
    busy.current = false; setWait(null);
  };

  const load = async () => {
    setLoadFail(false);
    try {
      const r = await api(`${CH_API}?date=${date}`);
      if (!Array.isArray(r.messages)) throw new Error('bad');
      setChat({ messages: r.messages, memory: r.memory || [] });
    } catch { setLoadFail(true); return; }
    if (ask) send(ask);
  };

  const change = async (payload, onMemory) => {                  // every memory change and every "Remember" tap goes through here
    setMemBusy(true); setMemError(null);
    try {
      const r = await api(CH_API, { method: 'PUT', body: JSON.stringify(payload) });
      if (r.error && !r.memory) throw new Error(r.error);
      setChat((c) => ({ messages: r.messages || c.messages, memory: r.memory || c.memory }));
      if (r.error) setMemError(r.error); else if (onMemory) onMemory();
    } catch { setMemError('That didn’t save. Try again.'); }
    setMemBusy(false);
  };
  const saveLines = (lines, done) => change({ memory: lines.map((l) => ({ id: l.id, text: l.text })) }, done);
  const addFact = () => { const t = fact.trim(); if (t) saveLines([...(chat.memory || []), { text: t }], () => setFact('')); };
  const clear = async () => {
    setSure(false);
    try { const r = await api(`${CH_API}?date=${date}`, { method: 'DELETE' }); if (Array.isArray(r.messages)) { setChat((c) => ({ ...c, messages: r.messages })); setFail(null); } } catch {}
  };

  // Opening: lock the page behind, take focus, slide up. Closing puts all of it back, focus included.
  useEffect(() => {
    const opener = document.activeElement, root = document.getElementById('root'), b = document.body.style, y = window.scrollY;
    const was = { position: b.position, top: b.top, left: b.left, right: b.right };
    b.position = 'fixed'; b.top = `-${y}px`; b.left = '0'; b.right = '0';
    if (root) root.inert = true;
    const raf = requestAnimationFrame(() => requestAnimationFrame(() => setOn(true)));
    (ask ? closeBtn.current : input.current).focus({ preventScroll: true });     // a typed question starts in the box; a tapped one leaves the keyboard down
    const key = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', key);
    // The phone keyboard shrinks the visible area but not the layout, so keep the sheet (and its input) inside what can be seen.
    const vv = window.visualViewport;
    const fit = () => { const el = sheet.current; if (!el || !vv) return; const kb = window.innerHeight - vv.height > 80; el.style.top = kb ? vv.offsetTop + 'px' : ''; el.style.height = kb ? vv.height + 'px' : ''; el.style.bottom = kb ? 'auto' : ''; };
    if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); }
    if (chat.messages == null) load(); else if (ask) send(ask);
    return () => {
      cancelAnimationFrame(raf); document.removeEventListener('keydown', key);
      if (vv) { vv.removeEventListener('resize', fit); vv.removeEventListener('scroll', fit); }
      Object.assign(b, was); window.scrollTo(0, y);
      if (root) root.inert = false;
      if (opener && opener.focus) opener.focus({ preventScroll: true });
    };
  }, []);

  // Keep the newest line in view.
  useEffect(() => { const el = body.current; if (el && view === 'chat') el.scrollTop = el.scrollHeight; }, [chat.messages, wait, fail, view, sure]);

  // Dragging the head moves the sheet with the finger. Let go and it either settles back or carries on down and closes,
  // decided by where the flick would come to rest, not by where the finger stopped. Pulling up past the top resists.
  const dragStart = (e) => {
    if (still() || closing.current || e.target.closest('button') || (e.pointerType === 'mouse' && e.button !== 0)) return;
    drag.current = { id: e.pointerId, y0: e.clientY, at: 0, moving: false, hist: [[performance.now(), e.clientY]] };
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const dragMove = (e) => {
    const d = drag.current, p = panel.current;
    if (!d || d.id !== e.pointerId || !p) return;
    const dy = e.clientY - d.y0;
    if (!d.moving) { if (Math.abs(dy) < 6) return; d.moving = true; sheet.current.classList.add('drag'); }
    d.hist.push([performance.now(), e.clientY]); if (d.hist.length > 6) d.hist.shift();
    const h = p.offsetHeight;
    d.at = dy >= 0 ? dy : -chRubber(-dy, h);
    p.style.transform = `translateY(${d.at}px)`;
    back.current.style.opacity = String(1 - clamp(d.at / h, 0, 1) * 0.8);
  };
  const dragEnd = (e) => {
    const d = drag.current, p = panel.current;
    if (!d || d.id !== e.pointerId) return;
    drag.current = null;
    if (!d.moving || !p) return;
    const [t0, y0] = d.hist[0], [t1, y1] = d.hist[d.hist.length - 1], v = t1 - t0 > 0 ? (y1 - y0) / (t1 - t0) * 1000 : 0;
    const away = e.type !== 'pointercancel' && d.at + chProject(v) > p.offsetHeight * 0.5;
    sheet.current.classList.remove('drag');
    back.current.style.opacity = '';
    if (away) { p.style.transform = 'translateY(100%)'; close(); } else p.style.transform = '';
  };

  const msgs = chat.messages, lines = chat.memory || [];
  const empty = msgs && !msgs.length && !wait && !fail;

  return ReactDOM.createPortal(
    <div className={'ch-sheet' + (on ? ' on' : '')} ref={sheet}>
      <div className="ch-back" ref={back} onClick={close} />
      <div className="ch-panel" ref={panel} role="dialog" aria-modal="true" aria-labelledby="ch-title">
        <header className="ch-head" onPointerDown={dragStart} onPointerMove={dragMove} onPointerUp={dragEnd} onPointerCancel={dragEnd}>
          <h2 id="ch-title">{title}</h2>
          <button ref={closeBtn} className="ch-ico" aria-label="Close" onClick={close}><Icon n="x" /></button>
        </header>
        <div className="ch-tabs"><Seg items={[['chat', 'Chat'], ['memory', 'What I know about you']]} value={view} onChange={(v) => { setFresh(null); setView(v); }} label="Chat, or what Claude knows about you" /></div>

        <div className="ch-body" ref={body}>
          {view === 'memory' ? (
            chat.memory == null
              ? (loadFail ? <p className="ch-err">Couldn’t load the list. <button className="ch-txt ch-strong" onClick={load}>Try again</button></p> : <div aria-label="Loading the list"><div className="skel" /><div className="skel" style={{ width: '70%' }} /></div>)
              : <ChatMemory lines={lines} busy={memBusy} error={memError} onChange={(next) => saveLines(next)} />
          ) : (
            <div className="ch-log" aria-live="polite">
              {msgs == null && !loadFail && <div aria-label="Loading the chat"><div className="skel" /><div className="skel" style={{ width: '80%' }} /><div className="skel" style={{ width: '55%' }} /></div>}
              {loadFail && <p className="ch-err">Couldn’t load this chat. <button className="ch-txt ch-strong" onClick={load}>Try again</button></p>}
              {empty && (<>
                <p className="ch-intro">Claude answers from your own numbers: this morning, the last 14 days, tonight’s plan, your gym sessions and what it knows about you.</p>
                <ul className="ch-asks">{asks.map((q) => <li key={q}><button onClick={() => send(q)}><span>{q}</span><Icon n="arrow-up" /></button></li>)}</ul>
              </>)}
              {(msgs || []).map((m) => (m.role === 'user' ? <p key={m.id} className="ch-q">{m.text}</p> : (
                <div key={m.id} className={'ch-a' + (m.id === fresh ? ' typing' : '')}>
                  <ChatText text={m.text} typed={m.id === fresh} />
                  {m.remember && !m.remembered && (
                    <div className="ch-rem">
                      <button className="ch-rem-save" disabled={memBusy} onClick={() => change({ date, remember: m.id })}><Icon n="plus" /><span>Remember: {m.remember}</span></button>
                      <button className="ch-ico" aria-label="Don’t remember this" disabled={memBusy} onClick={() => change({ date, dismiss: m.id })}><Icon n="x" /></button>
                    </div>
                  )}
                  {m.remembered && <div className="ch-rem-done"><Icon n="check" />Saved to what I know about you</div>}
                </div>
              )))}
              {wait && (<>
                <p className="ch-q">{wait}</p>
                <div className="ch-wait" role="status" aria-label="Claude is working on it"><div className="skel" /><div className="skel" style={{ width: '85%' }} /><div className="skel" style={{ width: '50%' }} /></div>
              </>)}
              {fail && (<>
                <p className="ch-q ch-unsent">{fail.q}</p>
                <p className="ch-err" role="alert">{fail.msg} <button className="ch-txt ch-strong" onClick={() => send(fail.q)}>Try again</button></p>
              </>)}
              {memError && view === 'chat' && <p className="ch-err" role="alert">{memError}</p>}
              {msgs && msgs.length > 0 && !wait && (
                <p className="ch-clear">{sure
                  ? <>Clear every question and answer from this day? <button className="ch-txt ch-strong" onClick={clear}>Clear it</button><button className="ch-txt" onClick={() => setSure(false)}>Keep it</button></>
                  : <button className="ch-txt" onClick={() => setSure(true)}>Clear this chat</button>}</p>
              )}
            </div>
          )}
        </div>

        <form className="ch-bar" onSubmit={(e) => { e.preventDefault(); if (view === 'chat') send(text); else addFact(); }}>
          {view === 'chat'
            ? <input ref={input} className="ch-in" type="text" value={text} onChange={(e) => setText(e.target.value)} maxLength={600} placeholder="Ask about your numbers" aria-label="Your question" enterKeyHint="send" autoComplete="off" />
            : <input className="ch-in" type="text" value={fact} onChange={(e) => setFact(e.target.value)} maxLength={160} placeholder="Add something Claude should know" aria-label="A new line for Claude to remember" enterKeyHint="done" autoComplete="off" />}
          <button type="submit" className="ch-send" aria-label={view === 'chat' ? 'Send' : 'Add to the list'} disabled={view === 'chat' ? !text.trim() || !!wait || msgs == null : !fact.trim() || memBusy}><Icon n={view === 'chat' ? 'arrow-up' : 'plus'} /></button>
        </form>
      </div>
    </div>,
    document.body
  );
}

// The field under the morning call. Tapping it opens the sheet with the keyboard ready; tapping a question asks it.
function ChatEntry({ all, idx, gym, weights, wake }) {
  const day = all[idx];
  const [open, setOpen] = useState(null);                       // null, or { ask } while the sheet is up
  const [chat, setChat] = useState({ messages: null, memory: null });   // kept here so reopening the sheet is instant
  const live = day.date === isoToday();
  const trained = !!(gym && gym.sessions && gym.sessions.some((s) => s.date === day.date));
  const asks = chSuggest(day, tonightPlan(all, idx, wake), trained, live);
  const asked = chat.messages ? chat.messages.filter((m) => m.role === 'user').length : 0;
  const title = live ? 'Ask about today' : `Ask about ${dayLabel(day.date)}`;
  return (
    <div className="ask">
      <button className="ask-open" aria-haspopup="dialog" onClick={() => setOpen({})}>
        <span>{title}</span>
        {asked > 0 && <small>{asked} asked</small>}
        <i className="ask-go"><Icon n="arrow-up" /></i>
      </button>
      <ul className="ask-sug" aria-label="Suggested questions">{asks.map((q) => <li key={q}><button className="chip" onClick={() => setOpen({ ask: q })}>{q}</button></li>)}</ul>
      {open && <ChatSheet date={day.date} title={title} ask={open.ask} asks={asks} chat={chat} setChat={setChat}
        getContext={() => chContext({ all, idx, gym, weights, wake })} onClose={() => setOpen(null)} />}
    </div>
  );
}

/* ---------------------------------------------------------------- body age
   An honest estimate, not WHOOP's maths. Seven habits and readings from the last 90 days are each held against a
   published guideline for an adult man and turned into years added or taken off, in half-year steps, each capped.
   Body age = real age + the sum. The inputs lead; the single number is the last tile.
   An input only counts once it has enough days behind it; until then it is shown as still learning and adds nothing.
   The bands, caps, thresholds and sources are written up in docs/body-age-method.md. */

const BA_DOB = 'ow_dob';                 // date of birth, YYYY-MM-DD, kept on this phone only
const BA_DAYS = 90;                      // how far back an input looks
const BA_RECENT = 30;                    // and how recent some of it has to be
const BA_MIN_READY = 5;                  // inputs that must count before a total is shown (of 7)
const BA_CAP = 8;                        // the total never moves the age by more than this
const BA_DAY = 864e5;
const baT = (iso) => Date.parse(iso + 'T12:00:00Z');
const baSd = (a) => { const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };   // night-to-night spread (sample SD)
const baBand = (bands, v) => { for (const [under, years] of bands) if (v < under) return years; return 0; };
const baDate = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const baCount = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

// Years for each band: [value is under this, years]. Minus takes years off. Sources for every line are in docs/body-age-method.md.
const BA_BANDS = {
  sleep: [[300, 1.5], [360, 1], [390, 0.5], [420, 0], [540.5, -0.5], [570.5, 0], [Infinity, 0.5]],          // minutes asleep a night
  steady: [[45.5, -1], [60.5, -0.5], [90.5, 0], [120.5, 0.5], [Infinity, 1]],                                 // minutes of night-to-night swing
  rhr: [[50, -1.5], [55, -1], [60, -0.5], [70, 0], [80, 0.5], [90, 1], [Infinity, 1.5]],                      // bpm, measured overnight
  steps: [[3000, 1.5], [5000, 1], [6000, 0.5], [8000, 0], [10000, -0.5], [Infinity, -1]],                     // a day
  active: [[75, 1.5], [150, 0.5], [300, -0.5], [450, -1], [Infinity, -1.5]],                                  // moderate-equivalent minutes a week
  strength: [[0.01, 1], [1, 0.5], [2, 0], [Infinity, -1]],                                                    // gym days a week
};
const BA_CAPS = { sleep: [-0.5, 1.5], steady: [-1, 1], rhr: [-1.5, 1.5], steps: [-1, 1.5], active: [-1.5, 1.5], strength: [-1, 1], fat: [-1, 1.5] };
// Body fat for men by age: [age under, healthy from, overweight from, obese from] in % (Gallagher 2000).
const BA_FAT = [[40, 8, 20, 25], [60, 11, 22, 28], [Infinity, 13, 25, 30]];
const baFatRow = (age) => BA_FAT.find((r) => age < r[0]);
const baFatYears = (pct, age) => { const [, lo, over, obese] = baFatRow(age); return pct < lo ? 0 : pct < over ? -1 : pct < obese ? 0.5 : 1.5; };

// Age in completed years, or null if the date isn't one an adult guideline covers.
function baAge(dob, today) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dob || '')) return null;
  const [y, m, d] = dob.split('-').map(Number), [ty, tm, td] = today.split('-').map(Number);
  const a = ty - y - (tm < m || (tm === m && td < d) ? 1 : 0);
  return a >= 18 && a <= 100 ? a : null;
}

// Enough days to count? Needs `need` of them in the last 90 and `fresh` of those in the last 30.
function baEnough(n, recent, need, fresh, noun) {
  if (n < need) return { status: 'learning', why: `Still learning. ${n} of ${need} ${noun} so far, so this isn’t counted yet.` };
  if (recent < fresh) return { status: 'learning', why: `Gone quiet. Only ${recent} of the ${fresh} ${noun} it needs from the last 30 days, so this isn’t counted for now.` };
  return { status: 'ready', why: null };
}

// One row per input: your number, the range it is held against, and the years it adds or takes off (null until it counts).
function baInputs(all, gym, today, age) {
  const t0 = baT(today);
  const ago = (d) => Math.round((t0 - baT(d.date)) / BA_DAY);
  const win = all.filter((d) => ago(d) >= 0 && ago(d) < BA_DAYS);
  const fresh = (list) => list.filter((d) => ago(d) < BA_RECENT).length;
  const rows = [];
  const add = (k, name, o) => rows.push({ k, name, cap: BA_CAPS[k] || null, status: 'missing', value: null, years: null, ...o });
  const pos = (v, band) => (v < band[0] ? 'below' : v > band[1] ? 'above' : 'in');

  // Sleep length and how steady it is, from the same nights.
  const nights = win.filter((d) => d.sleep && d.sleep.asleep_min);
  const asleep = nights.map((d) => d.sleep.asleep_min);
  const nightsOk = baEnough(nights.length, fresh(nights), 21, 7, 'nights');
  if (!nights.length) {
    add('sleep', 'Sleep', { why: 'No sleep recorded in the last 90 days.' });
    add('steady', 'Sleep consistency', { why: 'No sleep recorded in the last 90 days.' });
  } else {
    const avg = mean(asleep);
    add('sleep', 'Sleep', { ...nightsOk, value: avg, text: dur(avg), detail: `a night, over ${baCount(nights.length, 'night')}`,
      scale: [300, 600], band: [420, 540], range: 'Healthy range 7h to 9h', where: pos(Math.round(avg), [420, 540]),
      say: { in: 'In the healthy range', below: 'Below the healthy range', above: 'Above the healthy range' },
      years: nightsOk.status === 'ready' ? baBand(BA_BANDS.sleep, avg) : null });
    if (nights.length < 2) add('steady', 'Sleep consistency', { status: 'learning', why: 'Still learning. It takes more than one night to see how much your sleep varies.' });
    else {
      const swing = baSd(asleep);
      const timed = nights.filter((d) => d.sleep.start && d.sleep.end);
      const beds = timed.map((d) => { const m = minOfDay(d.sleep.start); return m > 720 ? m - 1440 : m; }), ups = timed.map((d) => minOfDay(d.sleep.end));
      add('steady', 'Sleep consistency', { ...nightsOk, value: swing, text: `${Math.round(swing)} min`, detail: 'swing in sleep length, night to night',
        scale: [0, 150], band: [0, 60], range: 'Target 60 min or less', where: pos(Math.round(swing), [0, 60]),
        say: { in: 'On target', above: 'More than the target' },
        extra: timed.length >= 7 ? `Bedtime swings by ${Math.round(baSd(beds))} min and wake-up by ${Math.round(baSd(ups))} min, from the ${timed.length} nights with clock times. Shown for interest, not scored.` : null,
        years: nightsOk.status === 'ready' ? baBand(BA_BANDS.steady, swing) : null });
    }
  }

  const hearts = win.filter((d) => d.rhr);
  if (!hearts.length) add('rhr', 'Resting heart rate', { why: 'No resting heart rate in the last 90 days.' });
  else {
    const ok = baEnough(hearts.length, fresh(hearts), 21, 7, 'nights'), avg = mean(hearts.map((d) => d.rhr));
    add('rhr', 'Resting heart rate', { ...ok, value: avg, text: `${Math.round(avg)} bpm`, detail: `overnight, over ${baCount(hearts.length, 'night')}`,
      scale: [40, 100], band: [40, 59.9], range: 'Target under 60 bpm', where: pos(avg, [0, 59.999]),
      say: { in: 'On target', above: 'Above the target' }, years: ok.status === 'ready' ? baBand(BA_BANDS.rhr, avg) : null });
  }

  const walked = win.filter((d) => d.steps > 0 && d.date !== today);          // today isn't finished, so it would drag the average down
  if (!walked.length) add('steps', 'Steps', { why: 'No step counts in the last 90 days.' });
  else {
    const ok = baEnough(walked.length, fresh(walked), 21, 7, 'days'), avg = mean(walked.map((d) => d.steps));
    add('steps', 'Steps', { ...ok, value: avg, text: Math.round(avg).toLocaleString('en-GB'), detail: `a day, over ${baCount(walked.length, 'day')}`,
      scale: [0, 14000], band: [8000, 14000], range: 'Target 8,000 or more', where: pos(avg, [8000, Infinity]),
      say: { in: 'On target', below: 'Short of the target' }, years: ok.status === 'ready' ? baBand(BA_BANDS.steps, avg) : null });
  }

  // Minutes at a moderate (40 to 59% of heart rate reserve) and hard (60% and up) heart rate, on days the watch was on
  // for most of the day. Same reserve sum as strainOf. A hard minute counts as two, as the WHO guideline counts it.
  const worn = win.filter(fullDay);
  if (!worn.length) add('active', 'Active minutes', { why: 'No full day of heart rate in the last 90 days. The watch has to be on for most of a day.' });
  else {
    let mod = 0, hard = 0;
    worn.forEach((d) => d.hr_buckets.forEach((mins, i) => {
      const reserve = (42.5 + i * 5 - d.restHr) / (d.maxHr - d.restHr);
      if (reserve >= 0.6) hard += mins; else if (reserve >= 0.4) mod += mins;
    }));
    const wk = (x) => x / worn.length * 7, total = wk(mod) + 2 * wk(hard);
    const ok = baEnough(worn.length, fresh(worn), 14, 7, 'full days of heart rate');
    add('active', 'Active minutes', { ...ok, value: total, text: `${Math.round(total)} min`, detail: `a week, over ${baCount(worn.length, 'full day')} of heart rate`,
      scale: [0, 450], band: [150, 450], range: 'Target 150 or more', where: pos(total, [150, Infinity]),
      say: { in: 'On target', below: 'Short of the target' },
      extra: `${Math.round(wk(mod))} min at a moderate heart rate and ${Math.round(wk(hard))} min at a hard one. A hard minute counts as two.`,
      years: ok.status === 'ready' ? baBand(BA_BANDS.active, total) : null });
  }

  // Strength: gym days a week over the last four weeks, once the gym log itself is four weeks old.
  const sessions = ((gym && gym.sessions) || []).filter((s) => s.date <= today);
  const gymDays = [...new Set(sessions.map((s) => s.date))].sort();
  if (!gymDays.length) add('strength', 'Strength training', { why: gym && gym.connected ? 'No gym sessions logged yet.' : 'Your gym app isn’t connected.' });
  else {
    const logAge = Math.round((t0 - baT(gymDays[0])) / BA_DAY), recent = gymDays.filter((d) => t0 - baT(d) < 28 * BA_DAY).length, perWeek = recent / 4;
    const ready = logAge >= 28, show = (x) => String(Math.round(x * 10) / 10);
    add('strength', 'Strength training', ready
      ? { status: 'ready', value: perWeek, text: show(perWeek), detail: `gym ${perWeek === 1 ? 'day' : 'days'} a week, last 4 weeks`, scale: [0, 4], band: [2, 4], range: 'Target 2 or more',
        where: pos(perWeek, [2, Infinity]), say: { in: 'On target', below: 'Short of the target' }, years: baBand(BA_BANDS.strength, perWeek) }
      : { status: 'learning', text: baCount(gymDays.length, 'session'), detail: `logged since ${baDate(gymDays[0])}`,
        why: 'Still learning. The target is 2 or more gym days a week, and your gym log needs 4 weeks behind it before a weekly average means anything. Not counted yet.' });
  }

  // Body fat from the scale. Needs three weigh-ins this month (one reading swings with how much water you've had) and your age.
  const weighed = win.filter((d) => d.body_fat_pct && ago(d) < BA_RECENT);
  if (!weighed.length) add('fat', 'Body fat', { why: 'No body fat reading from the scale in the last 30 days.' });
  else {
    const pct = mean(weighed.map((d) => d.body_fat_pct)), kgs = weighed.filter((d) => d.weight_kg).map((d) => d.weight_kg);
    const kg = kgs.length ? mean(kgs) : null, f = age != null ? baFatRow(age) : null;
    const st = weighed.length < 3 ? { status: 'learning', why: `Still learning. ${weighed.length} of 3 weigh-ins this month, so this isn’t counted yet. One reading shifts with how much water you’ve had.` }
      : age == null ? { status: 'learning', why: 'Needs your date of birth. The healthy range for body fat moves up with age.' } : { status: 'ready', why: null };
    add('fat', 'Body fat', { ...st, value: pct, text: `${Math.round(pct * 10) / 10}%`, detail: `from the scale, ${baCount(weighed.length, 'weigh-in')}`,
      ...(f ? { scale: [5, 35], band: [f[1], f[2] - 0.1], range: `Healthy range ${f[1]} to ${f[2] - 1}%`, where: pos(pct, [f[1], f[2] - 0.001]),
        say: { in: 'In the healthy range', below: 'Below the healthy range', above: 'Above the healthy range' } } : {}),
      extra: kg ? `At ${Math.round(kg * 10) / 10} kg that is about ${Math.round(kg * (1 - pct / 100) * 10) / 10} kg of lean mass. Lean mass isn’t scored, because judging it needs your height.` : null,
      years: st.status === 'ready' ? baFatYears(pct, age) : null });
  }

  // HRV is shown but never counted.
  const hrv = win.filter((d) => d.hrv_ms).map((d) => d.hrv_ms);
  add('hrv', 'Heart rate variability', { status: 'info', value: hrv.length ? mean(hrv) : null, text: hrv.length ? `${Math.round(mean(hrv))} ms` : null,
    detail: hrv.length ? `overnight, over ${baCount(hrv.length, 'night')}` : null,
    why: 'Left out on purpose. A normal HRV for one healthy person can be several times another’s, so it can’t be turned into years fairly. It drives your recovery score instead.' });
  return rows;
}

// The sum. `years` only counts inputs that are ready; lo and hi show how far the inputs still waiting could move it.
function baTotal(rows, age) {
  const scored = rows.filter((r) => r.cap), ready = scored.filter((r) => r.status === 'ready'), waiting = scored.filter((r) => r.status !== 'ready');
  const sum = ready.reduce((a, r) => a + r.years, 0), enough = ready.length >= BA_MIN_READY;
  const cap = (x) => clamp(x, -BA_CAP, BA_CAP);
  return { ready: ready.length, of: scored.length, enough, waiting, years: cap(sum),
    lo: cap(sum + waiting.reduce((a, r) => a + r.cap[0], 0)), hi: cap(sum + waiting.reduce((a, r) => a + r.cap[1], 0)),
    bodyAge: enough && age != null ? age + cap(sum) : null };
}
const baList = (names) => (names.length < 2 ? names.join('') : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1]);
const baYearsSay = (y) => (y === 0 ? 'The same as your age' : `${Math.abs(y) === 0.5 ? 'Half a year' : Math.abs(y) === 1 ? '1 year' : Math.abs(y) + ' years'} ${y < 0 ? 'younger' : 'older'} than your age`);


// "57 bpm" as [57, bpm], so the unit can be set small like every other number in the app.
const baSplit = (t) => { const m = String(t).match(/^([\d.,]+)\s?(.*)$/); return m ? [m[1], m[2]] : [t, '']; };

// One input as a tile: your number on the left, the years it adds or takes off on the right, then a ruler with the
// range it is held against. Same quiet ruler as the sleep stages: grey track, the target range, a ringed dot for you.
function BodyAgeTile({ row }) {
  const counted = row.status === 'ready', ruler = row.value != null && row.scale, w = 333;
  const p = (x) => clamp((x - row.scale[0]) / (row.scale[1] - row.scale[0]), 0.02, 0.98) * w;
  const said = counted ? (row.years === 0 ? 'no change' : `${row.years < 0 ? 'took off' : 'added'} ${Math.abs(row.years)} years`) : 'not counted';
  const icon = row.where === 'in' ? 'check' : row.where === 'below' ? 'arrow-down' : 'arrow-up';
  const [v, unit] = row.text ? baSplit(row.text) : [];
  return (
    <Tile className={counted ? '' : 'ba-off'}>
      <Lab>{row.name}</Lab>
      {(row.text || row.cap) && (<>
        <div className="between" style={{ marginTop: 10 }}>
          <div className="num n4">{!row.text ? null : row.k === 'sleep' ? <Dur m={row.value} /> : <>{v}{unit && <small>{unit}</small>}</>}</div>
          {row.cap && <div className="num n4 ba-yrs" role="img" aria-label={said}>{counted ? <>{signed(row.years)}<small>{Math.abs(row.years) === 1 ? 'year' : 'years'}</small></> : '–'}</div>}
        </div>
        <div className="between cap" style={{ marginTop: 5 }}>
          <span>{row.detail}</span>
          {row.cap && <span className="right" style={{ flex: 'none' }}>{counted ? (row.years < 0 ? 'taken off' : row.years > 0 ? 'added' : 'no change') : 'not counted yet'}</span>}
        </div>
      </>)}
      {ruler && (<>
        <div style={{ margin: '12px 0 0' }}>
          <svg className="fit" viewBox={`0 0 ${w} 18`} role="img" aria-label={`${row.name} ${row.text}. ${row.range}.`}>
            <rect x="0" y="7" width={w} height="4" rx="2" fill={P.track} />
            <rect x={p(row.band[0])} y="7" width={Math.max(3, p(row.band[1]) - p(row.band[0]))} height="4" rx="2" fill={P.faint} />
            <circle className="pop" cx={p(row.value)} cy="9" r="5" fill={counted ? P.ink : P.muted} stroke={P.tile} strokeWidth="2" />
          </svg>
        </div>
        <div className="ba-foot cap"><span><b><Icon n={icon} /> {row.say[row.where]}</b></span><span>{row.range}</span></div>
      </>)}
      {row.why && <p className="cap" style={{ marginTop: row.text ? 10 : 8 }}>{row.why}</p>}
      {row.extra && <p className="cap" style={{ marginTop: 6 }}>{row.extra}</p>}
    </Tile>
  );
}

// exampleAge is for layout previews only: it stands in for a missing date of birth and says so on screen. The app never passes it.
function BodyAge({ all, gym, today = isoToday(), exampleAge = null }) {
  const [dob, setDob] = useState(() => { try { return localStorage.getItem(BA_DOB) || ''; } catch { return ''; } });
  const [draft, setDraft] = useState(dob);
  const [editing, setEditing] = useState(false);
  const [bad, setBad] = useState(false);
  const realAge = baAge(dob, today), example = realAge == null && exampleAge != null;
  const age = realAge != null ? realAge : exampleAge;
  const rows = useMemo(() => baInputs(all, gym, today, age), [all, gym, today, age]);
  const sum = baTotal(rows, age);
  const asking = age == null;                 // no age at all: the sum is shown as years, not as an age
  const save = (e) => {
    e.preventDefault();
    if (baAge(draft, today) == null) { setBad(true); return; }
    try { localStorage.setItem(BA_DOB, draft); } catch {}
    setDob(draft); setEditing(false); setBad(false);
  };
  const waitingNames = baList(sum.waiting.map((r) => r.name.toLowerCase()));

  return (
    <section id="body-age" aria-label="Body age">
      <div className="sect"><h2>Body age</h2><span className="wt" style={{ fontSize: 13 }}>Last {BA_DAYS} days</span></div>
      <div className="grid">
        <Tile hero>
          <p className="say lead">A rough estimate to keep you motivated, not a medical measure. Each habit below is held against a published guideline and adds or takes off up to a year and a half.</p>
          {example && <p className="ba-banner"><Icon n="info" /><span>Example age {exampleAge}, for layout only. The inputs are real, the age is a stand-in, and so is the body age at the bottom.</span></p>}
          <div className="hr" />
          {asking || editing ? (
            <form className="ba-ask" onSubmit={save}>
              <label htmlFor="ba-dob">{editing ? 'Your date of birth' : 'First, your date of birth'}</label>
              <div className="ba-ask-row">
                <input id="ba-dob" type="date" value={draft} min="1920-01-01" max={today} required aria-describedby="ba-dob-hint" onChange={(e) => { setDraft(e.target.value); setBad(false); }} />
                <button className="btn" type="submit" disabled={!draft}>Save</button>
              </div>
              <p className="cap" style={{ marginTop: 10 }} id="ba-dob-hint" role={bad ? 'alert' : undefined}>{bad
                ? 'That date doesn’t give an age between 18 and 100. The guidelines used here are for adults.'
                : 'Asked once and kept on this phone. Your watch doesn’t know it, and the years below need an age to be added to.'}</p>
            </form>
          ) : (
            <div className="between end">
              <div><div className="lab"><span>{example ? 'Example age' : 'Your age'}</span></div>
                {realAge != null && <button className="textlink" style={{ marginBottom: -12 }} onClick={() => { setDraft(dob); setEditing(true); }}>Change date of birth</button>}</div>
              <div className="num n2">{age}</div>
            </div>
          )}
        </Tile>

        {rows.map((r) => <BodyAgeTile key={r.k} row={r} />)}

        <Tile hero>
          <Lab right={`${sum.ready} of ${sum.of} inputs counted`}>{asking ? 'Years so far' : example ? 'Example body age' : 'Estimated body age'}</Lab>
          <div className="num nh" style={{ marginTop: 14, color: sum.enough ? P.ink : P.faint }}>{!sum.enough ? '–' : asking ? <>{signed(sum.years)}<small style={{ marginLeft: 6 }}>{Math.abs(sum.years) === 1 ? 'year' : 'years'}</small></> : sum.bodyAge}</div>
          {sum.enough ? (<>
            <p className="say lead" style={{ marginTop: 14 }}>{asking ? 'Add your date of birth at the top of this section to see this as an age. ' : <><b><Icon n={sum.years < 0 ? 'arrow-down' : sum.years > 0 ? 'arrow-up' : 'equals'} /> {baYearsSay(sum.years)}.</b> </>}Added up from {sum.ready} of {sum.of} inputs.</p>
            {sum.waiting.length > 0 && <p className="cap" style={{ marginTop: 8 }}>{waitingNames.charAt(0).toUpperCase() + waitingNames.slice(1)} {sum.waiting.length === 1 ? 'isn’t' : 'aren’t'} counted yet. Once {sum.waiting.length === 1 ? 'it is' : 'they are'}, the total could land anywhere from {asking ? `${signed(sum.lo)} to ${signed(sum.hi)} years` : `${age + sum.lo} to ${age + sum.hi}`}.</p>}
          </>) : (
            <p className="say" style={{ marginTop: 14 }}>Not enough to add up yet. {sum.ready} of {sum.of} inputs have enough days behind them, and it takes {BA_MIN_READY} before a total is shown. The tiles above fill in as you wear the watch, log the gym and step on the scale.</p>
          )}
          <details className="ba-how">
            <summary>What this can and can’t tell you<Icon n="caret-down" /></summary>
            <p>It is your age plus the years in the tiles above, nothing else. Each one moves in half-year steps and is capped, and the total can’t move your age by more than {BA_CAP} years.</p>
            <p>The guidelines come from studies of large groups. They say what tends to be true across thousands of people, not what is true of you.</p>
            <p>It can’t see illness, family history, smoking, diet or blood tests, and it has no fitness test such as VO2 max. The watch and the scale estimate; they don’t measure the way a clinic does.</p>
            <p>It isn’t WHOOP Age and doesn’t copy WHOOP’s maths.</p>
          </details>
        </Tile>
      </div>
    </section>
  );
}

// The readings that can warn early, each with the direction that matters.
function watchList(day) {
  return [
    { k: 'hrv', name: 'Heart rate variability', short: 'HRV', value: day.hrv_ms ? Math.round(day.hrv_ms) : null, r: day.ranges.hrv, bad: 'below', fmt: (x) => Math.round(x) + ' ms', none: 'No reading' },
    { k: 'rhr', name: 'Resting heart rate', short: 'resting heart rate', value: day.rhr ?? null, r: day.ranges.rhr, bad: 'above', fmt: (x) => Math.round(x) + ' bpm', none: 'No reading' },
    { k: 'resp', name: 'Breathing rate', short: 'breathing rate', value: day.resp_rate ?? null, r: day.ranges.resp, bad: 'above', fmt: (x) => x.toFixed(1) + ' a minute', none: 'Not recorded' },
    { k: 'spo2', name: 'Blood oxygen', short: 'blood oxygen', value: day.spo2 != null ? Math.round(day.spo2) : null, r: day.ranges.spo2, bad: 'below', fmt: (x) => Math.round(x) + '%', none: 'Not recorded' },
  ].map((x) => { const vd = verdict(x.value, x.r); return { ...x, vd, out: vd != null && vd === x.bad }; });
}
function warningLine(day) {
  const out = watchList(day).filter((x) => x.out);
  if (!out.length) return null;
  if (out.length === 1) return `${cap1(out[0].short)} is ${out[0].vd} your usual range this morning.`;
  return `${cap1(listAnd(out.map((x) => x.short)))} are ${out.length === 2 ? 'both' : 'all'} outside your usual range this morning.`;
}

// Claude's words arrive once, when the message does. After that they are just text.
function Call({ coach, isLatest, day, hasAsk }) {
  const [typing, setTyping] = useState(false), seen = useRef(null);
  useLayoutEffect(() => {
    if (!coach.message || seen.current === coach.message) return;
    seen.current = coach.message; setTyping(true);
    const t = setTimeout(() => setTyping(false), 2000); return () => clearTimeout(t);
  }, [coach.message]);
  const when = day.date === isoToday() ? 'this morning' : isLatest ? 'on ' + dayLabel(day.date) : null;
  return (
    <div className={'call' + (hasAsk ? ' has-ask' : '')} aria-live="polite">
      <Lab icon="sparkle">{when ? `Claude, ${when}` : 'Claude'}</Lab>
      {isLatest && coach.message ? <p className={typing ? 'typing' : ''}><Typed text={coach.body} /></p>
        : isLatest && coach.loading ? <div aria-label="Claude is writing the call"><div className="skel" /><div className="skel" /><div className="skel" style={{ width: '70%' }} /></div>
        : <p className="quiet">{isLatest && coach.error ? 'Claude’s call didn’t come through. Open the app again in a minute.' : 'Claude makes the call for your latest morning.'}</p>}
    </div>
  );
}

// The day at the top: three rings on the dark page, recovery largest. Colour stays in the ring, never a filled card.
function Ring3({ kind, label, frac, text, unit, colour, onOpen, aria }) {
  const R = 44, C = 2 * Math.PI * R, ARC = C * 0.78, f = frac == null ? 0 : Math.max(0, Math.min(1, frac));
  return (
    <button className={'r3 ' + kind} onClick={onOpen} aria-label={aria}>
      <span className="r3-o">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r={R} className="tr" strokeDasharray={`${ARC} ${C}`} transform="rotate(129.6 50 50)" />
          {f > 0.004 && <circle cx="50" cy="50" r={R} className="va" stroke={colour} strokeDasharray={`${ARC * f} ${C}`} transform="rotate(129.6 50 50)" />}
        </svg>
        <b className="num">{text == null ? '–' : text}{text != null && unit ? <small>{unit}</small> : null}</b>
      </span>
      <span className="r3-l">{label}<Icon n="caret-right" /></span>
    </button>
  );
}

// Type the morning's HRV in from the Zepp app when it hasn't come through by itself. The real figure replaces it later.
function HrvEntry({ date }) {
  const [open, setOpen] = useState(false), [v, setV] = useState(''), [busy, setBusy] = useState(false), [err, setErr] = useState(null);
  const n = Number(v), ok = n >= 5 && n <= 250;
  async function save(e) {
    e.preventDefault();
    if (!ok || busy) return;
    setBusy(true); setErr(null);
    try {
      const r = await api('/api/health', { method: 'POST', body: JSON.stringify({ hrv: { date, ms: n } }) });
      if (!r.ok) throw new Error(r.error || 'not saved');
      window.dispatchEvent(new Event('ow-refresh'));
    } catch { setErr('That didn’t save. Try again.'); setBusy(false); }
  }
  if (!open) return <p className="hrv-add"><button type="button" onClick={() => setOpen(true)}>Type it in from Zepp</button></p>;
  return (
    <form className="hrv-form" onSubmit={save}>
      <label htmlFor="hrv-in">Last night’s HRV in Zepp</label>
      <div><input id="hrv-in" type="number" inputMode="numeric" min="5" max="250" autoFocus value={v} onChange={(e) => setV(e.target.value)} placeholder="42" /><span>ms</span>
        <button type="submit" disabled={!ok || busy}>{busy ? 'Saving' : 'Save'}</button></div>
      {err ? <p role="alert">{err}</p> : null}
    </form>
  );
}

function TrainingTile({ gym }) {
  const nav = useContext(Nav), sessions = (gym && gym.sessions) || [], ws = stWeekStart(isoToday());
  const wk = sessions.filter((s) => stWeekStart(s.date) === ws), vol = wk.reduce((a, s) => a + (s.volume || 0), 0), plan = planDays(gym);

// "Aesthetic 4 day block" says how many sessions a week the programme asks for. No number in the name, no target shown.
const planDays = (gym) => { const m = gym && gym.programme && gym.programme.name && gym.programme.name.match(/(\d)[\s-]*day/i); return m ? Number(m[1]) : null; };

function WeightTile({ day, weights, all, gym }) {
  const nav = useContext(Nav), upto = weights.filter((x) => x.date <= day.date), latest = upto[upto.length - 1];
  const recent = latest && Date.parse(day.date) - Date.parse(latest.date) < 14 * 864e5 ? latest : null;
  const goal = gym && gym.goal && gym.goal.targetWeight ? Number(gym.goal.targetWeight) : null;
  const fat = all.filter((d) => d.date <= day.date && d.body_fat_pct && Date.parse(day.date) - Date.parse(d.date) < 14 * 864e5).pop();
  const pts = recent ? upto.filter((x) => Date.parse(day.date) - Date.parse(x.date) < 30 * 864e5).slice(-8) : [];
  const prevW = pts.length > 1 ? pts[pts.length - 2] : null, diff = prevW ? Math.round((recent.w - prevW.w) * 100) / 100 : null;
  const W = 104, H = 62, vs = pts.map((p) => p.w), lo = Math.min(...vs), hi = Math.max(...vs), t0 = pts.length ? Date.parse(pts[0].date) : 0, t1 = pts.length ? Date.parse(pts[pts.length - 1].date) : 1;
  const X = (p) => 6 + (t1 === t0 ? 0.5 : (Date.parse(p.date) - t0) / (t1 - t0)) * (W - 14), Y = (v) => (hi === lo ? 26 : 8 + (1 - (v - lo) / (hi - lo)) * 34);

function StepsTile({ all, idx }) {

const SAY_DIR = { below: ['arrow-down', 'Below your usual'], above: ['arrow-up', 'Above your usual'], within: ['check', 'In your usual range'] };

function RecoveryScreen({ all, idx }) {
  const day = all[idx], dp = driverPoints(day), rows = windowRows(all, idx, 30), [word] = status(day.recovery);
  const list = watchList(day), measured = list.filter((x) => x.vd), out = list.filter((x) => x.out);
  const hrvU = usual(day.ranges.hrv), rhrU = usual(day.ranges.rhr), slU = usual(day.ranges.sleep);
  const hrvS = rows.filter((d) => d.hrv_ms), hrvV = hrvS.map((d) => d.hrv_ms);
  const lower = day.hrv_ms ? hrvS.filter((d) => d.date !== day.date && d.hrv_ms < day.hrv_ms).length : null;
  const rec = rows.filter((d) => d.recovery != null), recLower = rec.filter((d) => d.date !== day.date && d.recovery < day.recovery).length, recHigher = rec.filter((d) => d.date !== day.date && d.recovery > day.recovery).length;
  const gap = biggest(findGaps(rows, (d) => d.recovery));

        <div className="cap" style={{ margin: '6px 0 10px', minHeight: 36 }}>{value == null ? 'No reading this morning' : vd ? <><b><Icon n={SAY_DIR[vd][0]} /> {vd === 'within' ? 'Usual' : cap1(vd)}</b>{vd === 'within' ? ', ' : ' usual '}{fmt(u[0])} to {fmt(u[1])}</> : 'Not enough nights yet to know your usual'}</div>
        {range && <Trend rows={rows} val={val} lo={range[0]} hi={range[1]} colour={colour} band={u} w={146} h={64} xlabels={false} labelLast={false} aria={`${name}, last 30 mornings`} />}

            <div className="cap" style={{ marginTop: 4, fontSize: 13 }}>{{ good: '67 or over is a day to push', meh: '34 to 66 is a steady day', bad: '33 or under is a light day' }[band(day.recovery)] || 'Wear the watch to bed'}</div>

        {dp ? (<>

          {Object.keys(dp.by).length < 3 && <p className="cap" style={{ marginTop: 10 }}>{DRIVERS.filter(([k]) => dp.by[k] == null).map(([, , n]) => n).join(' and ')} had no reading, so the score leans on the other two this morning.</p>}

function TonightBlock({ plan, onWake }) {
  const [t, ap] = clockParts(plan.bed);
  const rows = [
    ['Your base need', dur(plan.base), null],
    ['Today’s strain', plan.forStrain ? `+${dur(plan.forStrain)}` : '+0m', plan.forStrain ? `${plan.strain} so far` : `${plan.strain} so far, nothing to add yet`],
    ['Sleep you’re short', plan.forDebt ? `+${dur(plan.forDebt)}` : '+0m', plan.forDebt ? `${dur(plan.short)} down ${plan.nights === 1 ? 'last night' : `over the last ${plan.nights} nights`}, paid back a third at a time` : 'You’re not short'],

  ];
  return (
    <Tile>
      <Lab icon="moon" right="To wake up recovered">Tonight</Lab>
      <div className="between end" style={{ marginTop: 12 }}>
        <div><div className="cap">In bed by</div><div className="num n2" style={{ marginTop: 4 }}>{t}<small style={{ color: P.ink, fontSize: 17 }}>{ap}</small></div></div>
        <WakeControl plan={plan} onWake={onWake} />

        <div className="tot"><dt>Time in bed</dt><dd>{dur(plan.inBed)}</dd></div>
      </dl>
    </Tile>

}

function SleepScreen({ all, idx, isLatest, wake, saveWake }) {

  const plan = isLatest ? tonightPlan(all, idx, wake) : null, rows = windowRows(all, idx, 30);
  const nights = rows.filter((d) => d.asleep), met = nights.filter((d) => d.sleepPerf >= 1).length;
  const stagedPrev = all.slice(Math.max(0, idx - 30), idx).filter((d) => d.sleep && d.sleep.deep_min);
  const short = st && day.need ? Math.round(day.need - st.asleep_min) : null;
  const hiS = Math.max(540, ...nights.map((d) => Math.max(d.asleep, d.need || 0))) + 20;
  return (
    <Detail title="Sleep" day={day}>
      <Tile hero vt>
        <Lab right={st && st.start ? `${clock(st.start)} to ${clock(st.end)}` : null}>{day.date === isoToday() ? 'Last night' : 'The night before'}</Lab>

          <div className="between end" style={{ marginTop: 14 }}>
            <div className="num nh"><Dur m={st.asleep_min} /></div>
            <div className="cap right" style={{ fontSize: 13, paddingBottom: 2 }}><b>{Math.round(day.sleepPerf * 100)}%</b> of the {hm(day.need)}<br />you needed</div>
          </div>
          <div style={{ margin: '18px 0 6px' }}><StageBar st={st} need={day.need} w={325} /></div>
          <div className="between cap"><span>Asleep {hm(st.asleep_min)}{!staged && day.sleep_score ? `, Zepp sleep score ${day.sleep_score}` : ''}</span><span><b>{short > 0 ? `${dur(short)} short` : 'Need met'}</b></span></div>
          {night ? (<>
            <div className="hr" />
            <div className="lab" style={{ marginBottom: 6 }}><span>Heart rate through the night</span></div>
            <NightHr n={night} w={325} />
          </>) : <><div className="hr" /><p className="cap">{st.start ? 'No minute-by-minute heart rate for this night, so there is no overnight line to draw.' : 'Zepp sent the total for this night without bed and wake times, so there is no overnight line to draw.'}</p></>}
        </>) : <p className="say" style={{ marginTop: 12 }}>No sleep recorded for this night. Wear the watch to bed and it shows here in the morning.</p>}
      </Tile>

      {staged && SLEEP_STAGES.map((s) => { const r = day.stageRange[s.k], v = st[s.k] || 0, vd = verdict(v, r), u = usual(r); return (
        <Tile c={2} key={s.k} className="narrow">
          <Lab><i className="sw" style={{ background: s.colour }} />{s.name}</Lab>
          <div className="num" style={{ marginTop: 12, fontSize: 22 }}><Dur m={v} /></div>
          {vd ? <><div style={{ margin: '10px 0 6px' }}><Ruler value={v} r={r} colour={s.colour} /></div><div className="cap" style={{ fontSize: 12 }}><b>{{ within: 'Usual', below: 'Low', above: 'High' }[vd]}</b><br />{dur(u[0])} to {dur(u[1])}</div></>
            : <div className="cap" style={{ marginTop: 10, fontSize: 12 }}>Usual not known yet</div>}
        </Tile>
      ); })}
      {st && <p className="foot c6">{staged ? <>{stagedPrev.length >= 5 ? `Stage amounts are set against your ${stagedPrev.length} nights with stages in the 30 days before, ${shortDate(stagedPrev[0].date)} to ${shortDate(stagedPrev[stagedPrev.length - 1].date)}. ` : `A usual range for each stage needs five nights with stages in the 30 days before. There ${stagedPrev.length === 1 ? 'is 1' : `are ${stagedPrev.length}`}. `}The watch shares how long each stage lasted, not when it happened, so there is no stage timeline to draw.{st.awake_min != null ? ` You were awake for ${stPlural(Math.round(st.awake_min), 'minute')}.` : ''}</>
        : 'Zepp shares the total and its own sleep score for this night, not the stages.'}</p>}

/* ---------------------------------------------------------------- Strain and the heart-rate day */

const daySessions = (gym, day) => ((gym && gym.sessions) || []).filter((s) => s.date === day.date).map((s) => ({ s, hr: sessionHr(s, day) }));

function StrainScreen({ all, idx, gym, showTarget }) {
  const day = all[idx], live = day.date === isoToday(), strain = day.strain, tg = showTarget ? strainTarget(all, idx) : null, has = tg && tg.lo != null;
  const prev = idx > 0 && consecutive(all[idx - 1], day) ? all[idx - 1] : null;
  const yard = strainYardstick(all, idx, gym), trained = !!(gym && gym.sessions && gym.sessions.some((s) => s.date === day.date));
  const state = strain == null ? 'No heart rate' : !has ? (live ? 'So far today' : 'For the day') : strain === 0 ? 'Nothing yet' : strain < tg.lo ? 'Below the range' : strain > tg.hi ? 'Over the range' : 'In range';
  const lastM = day.hr_min && day.hr_min.length ? day.hr_min[day.hr_min.length - 2] : null, th = hrThreshold(day);
  const marks = []; if (tg && !tg.learning) marks.push({ label: 'Usual day', v: Math.round(tg.usualDay * 10) / 10 }); if (prev && prev.strain != null) marks.push({ label: wkShort(prev.date), v: prev.strain });
  const counted = (d) => (d.hr_buckets || []).reduce((a, m, i) => a + (bucketCounts(i, d) ? m : 0), 0), onFor = (d) => (d.hr_buckets || []).reduce((a, b) => a + b, 0);
  const explain = strain >= 1 && day.hr_buckets ? day : prev && prev.strain >= 1 && prev.hr_buckets ? prev : null;
  const rows = windowRows(all, idx, 45), scored = rows.filter((d) => d.strain != null), firstMin = (d) => (d.hr_min && d.hr_min.length ? d.hr_min[0] : null);
  const DayBlock = ({ d, isLive }) => { const ss = daySessions(gym, d), late = firstMin(d) > 60; return (<>
    {d.hr_min && d.hr_min.length > 5 ? <div style={{ marginTop: 14 }}><DayHr day={d} live={isLive} sessions={ss.filter((x) => x.s.start && x.s.end).map((x) => ({ a: londonMin(x.s.start), b: londonMin(x.s.end), name: x.s.name }))} /></div>
      : <p className="empty">{d.hr_buckets ? 'This day has heart rate totals but no minute-by-minute line.' : 'No heart rate from the watch for this day.'}</p>}
    {late && <p className="cap" style={{ marginTop: 10 }}>The watch went on at {clock12(firstMin(d))}, so the hours before are missing and the real figure may be higher.</p>}
    {ss.map((x) => <SessionBlock key={x.s.name + x.s.date} s={x.s} hr={x.hr} day={d} />)}
  </>); };
  return (

        </div>
        <div style={{ marginTop: 22 }}><StrainRuler strain={strain} tg={tg} marks={marks} w={325} /></div>
        {has ? <p className="say lead" style={{ marginTop: 10 }}>At {day.recovery}% recovery, aim for {tg.why.charAt(0).toLowerCase() + tg.why.slice(1)}{tg.learning ? ' (still learning what your usual day is)' : ''}. {strain != null ? strainSentence({ strain, lo: tg.lo, hi: tg.hi, live, yard, trained }) : ''}</p>
          : showTarget ? <p className="say" style={{ marginTop: 10 }}>No target {live ? 'today' : 'for this day'}. Recovery couldn’t be scored this morning, and the target is set from it.</p> : null}
      </Tile>

      <Tile>
        <Lab right={day.hr_max ? `Peak ${day.hr_max} bpm` : null}>{live ? 'Heart rate today' : `Heart rate, ${wkDate(day.date)}`}</Lab>
        {strain != null && <p className="say" style={{ marginTop: 10 }}>Only minutes above about <b>{th} bpm</b> add strain. {counted(day) < 1 ? <>{live ? 'You have' : 'You'} peaked at <b>{day.hr_max}</b>, which is why {live ? 'today still reads' : 'the day read'} zero.</> : <><b>{dur(counted(day))}</b> {live ? 'so far' : 'of the day'} {counted(day) < 1.5 ? 'was' : 'were'} above it.</>}</p>}
        <DayBlock d={day} isLive={live} />
      </Tile>

        <div style={{ marginTop: 12 }}><ZoneBars day={explain} /></div>

        <Lab>Strain, last {rows.length} days</Lab>

          <div style={{ marginTop: 12 }}><Trend rows={rows} val={(d) => d.strain} lo={0} hi={21} kind="bar" colour={P.blue} ticks={[7, 14]} fmt={(v) => v.toFixed(1)} tfmt={(v) => String(v)} h={124} scrub refLine={tg && !tg.learning ? { v: tg.usualDay, label: `Usual day ${tg.usualDay.toFixed(1)}` } : null} aria={`Strain, last ${rows.length} days`} /></div>

        </>) : <p className="empty">No strain scored in the last {rows.length} days.</p>}
      </Tile>
    </Detail>
  );
}

/* ================================================================ Trends */

const SPANS = [[7, '7 nights'], [30, '30 nights'], [90, '90 nights']];
const nf = (v) => Math.round(v).toLocaleString('en-GB');
const TM = [
  { k: 'recovery', name: 'Recovery', unit: '%', kind: 'bar', lo: 0, hi: 100, ticks: [34, 67], val: (d) => d.recovery, colourFn: (v) => bandHex(v), fmt: (v) => String(Math.round(v)), noun: 'morning' },
  { k: 'strain', name: 'Strain', unit: '', kind: 'bar', lo: 0, hi: 21, ticks: [7, 14], val: (d) => d.strain, colour: P.blue, fmt: (v) => v.toFixed(1), noun: 'day' },
  { k: 'sleep', name: 'Sleep', unit: '', kind: 'bar', lo: 0, ticks: [240, 480], tfmt: (v) => v / 60 + 'h', val: (d) => d.asleep || null, need: (d) => d.need, colour: P.sleep, fmt: dur, isDur: true, range: 'sleep', noun: 'night' },
  { k: 'rhr', name: 'Resting HR', long: 'resting heart rate', unit: 'bpm', kind: 'line', val: (d) => d.rhr || null, range: 'rhr', fmt: (v) => String(Math.round(v)), noun: 'morning', pad: 2, by: 5 },
  { k: 'hrv_ms', name: 'HRV', long: 'HRV', unit: 'ms', kind: 'line', val: (d) => d.hrv_ms || null, range: 'hrv', fmt: (v) => String(Math.round(v)), noun: 'morning', pad: 4, by: 10 },
  { k: 'steps', name: 'Steps', unit: '', kind: 'bar', lo: 0, val: (d) => (d.steps == null ? null : d.steps), colour: P.blue, fmt: nf, tfmt: (v) => v / 1000 + 'k', noun: 'day', gapLabel: 'No step count' },
  { k: 'weight', name: 'Weight', unit: 'kg', kind: 'line', val: (d) => (d._w == null ? null : d._w), colour: P.soft, fmt: (v) => String(Math.round(v * 10) / 10), noun: 'weigh-in', pad: 0.4, by: 1, loose: true },
];

function trendModel(m, rows, latestDay) {
  const s = rows.filter((d) => m.val(d) != null), vals = s.map(m.val), live = (d) => m.k === 'strain' && d.date === isoToday();
  const done = s.filter((d) => !live(d)), avg = done.length ? mean(done.map(m.val)) : null;
  const u = m.range && latestDay ? usual(latestDay.ranges[m.range]) : null;
  let lo = m.lo, hi = m.hi, ticks = m.ticks;
  if (vals.length && (lo == null || hi == null)) {
    if (m.kind === 'bar') { hi = Math.max(...vals) * 1.08 || 1; if (m.k === 'sleep') hi = Math.max(540, ...s.map((d) => Math.max(d.asleep, d.need || 0))) + 20; if (m.k === 'steps') ticks = [hi > 11000 ? 10000 : hi > 5500 ? 5000 : null].filter(Boolean); }
    else { const a = [...vals, ...(u || [])]; lo = Math.min(...a) - m.pad; hi = Math.max(...a) + m.pad;
      const t0 = Math.ceil((lo + (hi - lo) * 0.12) / m.by) * m.by, t1 = Math.floor((hi - (hi - lo) * 0.1) / m.by) * m.by; ticks = t0 < t1 ? [t0, t1] : [t0]; }
  }
  const half = Math.floor(s.length / 2), a1 = s.slice(0, half).map(m.val), a2 = s.slice(half).map(m.val), change = a1.length && a2.length ? mean(a2) - mean(a1) : null;
  return { s, vals, avg, u, lo, hi, ticks, change, last: s[s.length - 1], gap: m.loose ? null : biggest(findGaps(rows, m.val)) };
}

// One plain sentence per metric, worked out from the nights on screen.
function trendSay(m, T, rows) {
  const { s, vals, u, last } = T, n = s.length, N = (k) => `${k} ${m.noun}${k === 1 ? '' : 's'}`;
  if (!n) return null;
  const when = (d) => (d.date === isoToday() ? (m.noun === 'morning' ? 'This morning’s' : 'Today’s') : `${cap1(wkDate(d.date))}’s`);
  if (m.k === 'recovery') { const g = vals.filter((v) => v >= 67).length, a = vals.filter((v) => v >= 34 && v < 67).length, r = n - g - a, low = Math.min(...vals);
    return `Recovered on ${g} of the ${N(n)} scored, part recovered on ${a} and running low on ${r}.${n > 2 && last && m.val(last) === low ? ` ${when(last)} ${low}% is the lowest of them.` : ''}`; }
  if (m.range && m.kind === 'line') {
    if (!u) return `${cap1(N(n))} tracked, from ${m.fmt(Math.min(...vals))} to ${m.fmt(Math.max(...vals))} ${m.unit}. Your usual range appears once five nights are on file.`;
    const inside = vals.filter((v) => v >= u[0] && v <= u[1]).length, vd = m.val(last) < u[0] ? 'below' : m.val(last) > u[1] ? 'above' : 'inside';
    const i = s.length > 1 ? Math.round((Date.parse(last.date) - Date.parse(s[s.length - 2].date)) / 864e5) - 1 : 0;
    return `Your ${m.long} sat inside your usual range on ${inside} of the ${N(n)} tracked. ${when(last)} ${m.fmt(m.val(last))} is ${vd} it${i >= 3 ? `, the first reading after ${i} days with no overnight data` : ''}.`;
  }
  if (m.k === 'sleep') { const met = s.filter((d) => d.sleepPerf >= 1).length; return `You met your sleep need on ${met} of the ${N(n)} tracked.${u ? ` Your usual night is ${dur(u[0])} to ${dur(u[1])}.` : ''}`; }
  if (m.k === 'strain') { const top = s.reduce((a, d) => (d.strain > a.strain ? d : a)); return `${cap1(N(n))} scored. The hardest was ${top.strain.toFixed(1)} on ${wkDate(top.date)}.${last.date === isoToday() ? ` Today is ${last.strain.toFixed(1)} so far and is left out of the average.` : ''}`; }
  if (m.k === 'steps') { const top = s.reduce((a, d) => (d.steps > a.steps ? d : a)); return `Your most was ${nf(top.steps)} on ${wkDate(top.date)}.${last.date === isoToday() ? ` Today’s ${nf(last.steps)} is the day so far.` : ''}${n === rows.length ? ' Your phone counts steps, so this one has no gap.' : ''}`; }
  if (m.k === 'weight') { if (n < 2) return `One weigh-in in this range, ${m.fmt(vals[0])} kg on ${wkDate(s[0].date)}. Step on the scale again and the line starts.`;
    const d = Math.round((vals[n - 1] - vals[0]) * 100) / 100; return `${cap1(N(n))}: ${m.fmt(vals[0])} kg on ${shortDate(s[0].date)} to ${m.fmt(vals[n - 1])} kg on ${shortDate(last.date)}, ${d === 0 ? 'no change' : `${Math.abs(d)} kg ${d < 0 ? 'down' : 'up'}`}.`; }
  return null;
}
function trendShort(m, T) {
  const { s, vals, u, last } = T, n = s.length;
  if (!n) return m.k === 'hrv_ms' ? 'No HRV from Zepp in this range.' : m.k === 'weight' ? 'No weigh-ins in this range.' : 'No data in this range.';
  if (m.k === 'recovery') return `Recovered on ${vals.filter((v) => v >= 67).length} of ${n} scored mornings.`;
  if (m.range && m.kind === 'line') return u ? `Latest ${m.fmt(m.val(last))} is ${m.val(last) < u[0] ? 'below' : m.val(last) > u[1] ? 'above' : 'inside'} your usual ${m.fmt(u[0])} to ${m.fmt(u[1])}.` : `${n} mornings tracked.`;
  if (m.k === 'sleep') return u ? `Usual night ${dur(u[0])} to ${dur(u[1])}.` : `${n} nights tracked.`;
  if (m.k === 'strain') return `${n} ${n === 1 ? 'day' : 'days'} scored.`;
  if (m.k === 'steps') { const top = s.reduce((a, d) => (d.steps > a.steps ? d : a)); return `Most ${nf(top.steps)}, ${wkDate(top.date)}.`; }
  return `${n} ${n === 1 ? 'weigh-in' : 'weigh-ins'}.`;
}

function Seg({ items, value, onChange, label }) {
  const i = Math.max(0, items.findIndex(([v]) => v === value));
  return (

    </div>

}

function Trends({ all, latest, weights, mk, setMk, gym, journal }) {
  const [span, setSpan] = useState(30);
  const rows = useMemo(() => { const w = {}; weights.forEach((x) => { w[x.date] = x.w; }); return windowRows(all, all.length - 1, span).map((d) => ({ ...d, _w: w[d.date] })); }, [all, weights, span]);
  const m = TM.find((x) => x.k === mk) || TM[0], latestDay = all[latest], T = trendModel(m, rows, latestDay);
  const shownAvg = useCount(T.avg, 700), say = trendSay(m, T, rows);
  const pick = (k) => { setMk(k); window.scrollTo(0, 0); };
  const chart = (mm, TT, props) => <Trend rows={rows} val={mm.val} lo={TT.lo} hi={TT.hi} kind={mm.kind} colour={mm.colour || P.ink} colourFn={mm.colourFn} band={mm.kind === 'line' ? TT.u : null} need={mm.need} fmt={mm.fmt} tfmt={mm.tfmt}

        <Fresh k={mk + span} className="t hero c6">
          {T.s.length ? (<>
            <div className="between end">
              <div><div className="lab"><span>{m.k === 'weight' ? `Average of ${T.s.length} ${T.s.length === 1 ? 'weigh-in' : 'weigh-ins'}` : `Average, ${T.s.length} ${m.noun}${T.s.length === 1 ? '' : 's'} tracked`}</span></div>
                <div className="num nh" style={{ marginTop: 10 }}>{T.avg == null ? '–' : m.isDur ? <Dur m={shownAvg || 0} /> : <>{m.fmt(shownAvg || 0)}{m.unit && <small>{m.unit}</small>}</>}</div></div>
              <div className="cap right" style={{ fontSize: 13, paddingBottom: 2 }}>{T.u && m.kind === 'line' ? <>Usual range<br /><b>{m.fmt(T.u[0])} to {m.fmt(T.u[1])} {m.unit}</b></> : T.change != null && T.s.length >= 4 ? <>Second half against first<br /><b>{(T.change > 0 ? '+' : T.change < 0 ? '−' : '') + (m.isDur ? dur(Math.abs(T.change)) : m.fmt(Math.abs(T.change)))}{m.isDur || !m.unit ? '' : ' ' + m.unit}</b></> : null}</div>
            </div>
            {say && <p className="say lead" style={{ margin: '14px 0' }}>{say}</p>}

            {m.need && <div className="leg"><span><i className="sw" style={{ background: P.sleep }} />Asleep</span><span><i className="sw" style={{ background: P.track, boxShadow: `inset 0 0 0 1px ${P.line2}` }} />What you needed that night</span></div>}
            {m.k === 'recovery' && <div className="leg"><span><i className="sw" style={{ background: P.green }} />Recovered</span><span><i className="sw" style={{ background: P.amber }} />Part recovered</span><span><i className="sw" style={{ background: P.red }} />Running low</span></div>}
          </>) : <><div className="lab"><span>{m.name}</span></div><p className="say" style={{ marginTop: 10 }}>{trendShort(m, T)}</p></>}
        </Fresh>
        {TM.filter((x) => x.k !== mk).map((x) => { const TT = trendModel(x, rows, latestDay); return (

            <div className="cap" style={{ margin: '6px 0 10px', minHeight: 36 }}>{trendShort(x, TT)}</div>
            {TT.s.length > 0 && chart(x, TT, { w: 146, h: 60, xlabels: false, labelLast: false })}
          </Tile>
        ); })}
      </div>
